<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="seasphereBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="55%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#005a8a"/>
    </linearGradient>
    <filter id="anchorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#002b49" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background matching SeaSphere logo -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#seasphereBg)"/>

  <!-- Anchor Emblem -->
  <g filter="url(#anchorShadow)" fill="none" stroke="#e0f7fe" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Ring -->
    <circle cx="32" cy="18" r="5.2" fill="none" stroke="#e0f7fe" stroke-width="3.8"/>
    <!-- Vertical Shank -->
    <line x1="32" y1="23.2" x2="32" y2="48"/>
    <!-- Horizontal Crossbar -->
    <line x1="22" y1="29" x2="42" y2="29" stroke-width="3.8"/>
    <!-- Curved Bottom Flukes -->
    <path d="M16 38 C 17 50, 47 50, 48 38"/>
    <!-- Fluke Arrowhead Tips -->
    <polyline points="12,39 16,36 20,40" stroke-width="3.2"/>
    <polyline points="44,40 48,36 52,39" stroke-width="3.2"/>
  </g>
</svg>
